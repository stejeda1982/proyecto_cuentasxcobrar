# T0.8 — Nginx: proxy inverso hacia PHP-FPM.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Tamaño máximo de adjuntos de soporte (RNF-GES-11: hasta 10 MB).
    client_max_body_size 12m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        # T0.7: el request-id entrante se propaga a la aplicación.
        fastcgi_param HTTP_X_REQUEST_ID $http_x_request_id;
    }

    # Estáticos con caché agresiva (el assets va con hash de versión).
    location ~* \.(css|js|svg|woff2?|png|jpg|jpeg)$ {
        expires 30d;
        access_log off;
    }

    # Health check del balanceador (T0.7).
    location = /up {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    }
}
