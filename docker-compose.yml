# T0.8 — Despliegue base del Sistema de Gestión de Cuentas por Cobrar.
#
# Stack: Nginx como proxy, PHP-FPM 8.4 (con ext-ldap para el conector
# del directorio corporativo), PostgreSQL 16 y Redis 7 (sesiones/cache
# en staging). Los respaldos pg_dump diarios los ejecuta el servicio
# `backups` (script deploy/respaldo_pg.sh, retención 14 días).
#
# Uso: docker compose up -d --build

name: cxc

services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: cxc-app:latest
    env_file: .env
    volumes:
      - almacenamiento:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'php artisan up --skip-maintenance || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    ports:
      - '8080:80'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - almacenamiento_publico:/var/www/html/public/storage:ro
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-cxc}
      POSTGRES_USER: ${DB_USERNAME:-cxc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    volumes:
      - datos_pg:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-cxc} -d ${DB_DATABASE:-cxc}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - datos_redis:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Respaldo diario pg_dump 03:30 UTC + retención 14 días (T0.8, RNF-DIS-03).
  backups:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - ./deploy/respaldo_pg.sh:/usr/local/bin/respaldo_pg.sh:ro
      - respaldos:/backups
    entrypoint: ['/bin/sh', '-c', 'while true; do /usr/local/bin/respaldo_pg.sh; sleep 86400; done']
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  datos_pg:
  datos_redis:
  almacenamiento:
  almacenamiento_publico:
  respaldos:
